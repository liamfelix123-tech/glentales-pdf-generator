services:
  - type: web
    name: glentales-pdf-generator
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app --bind 0.0.0.0:$PORT --timeout 300 --workers 1
    envVars:
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY
        sync: false
      - key: R2_SECRET_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: glentales-books
      - key: R2_PUBLIC_URL
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: VOICE_FEMALE
        value: qlnUbSLa6XkXV9pK52QP
      - key: VOICE_MALE
        value: nzFihrBIvB34imQBuxub
      - key: PYTHON_VERSION
        value: "3.12.0"
